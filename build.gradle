plugins {
    id 'org.springframework.boot' version '4.0.0'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'java'
    id 'jacoco'
}

group = 'org.pk.collector'
version = '1.0.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

configurations {
    configureEach {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
    }
}

dependencies {
    implementation platform('org.testcontainers:testcontainers-bom:1.19.8')
    
    // Spring Boot Core, Data JPA, JDBC, Validation, JSON, Actuator, Web
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-json'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.core:jackson-core'

    // Logging: Log4j2
    implementation 'org.springframework.boot:spring-boot-starter-log4j2'
    implementation 'org.apache.logging.log4j:log4j-layout-template-json'
    annotationProcessor 'org.apache.logging.log4j:log4j-core'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // JobRunr
    implementation 'org.jobrunr:jobrunr-spring-boot-4-starter:8.5.2'

    // Database and Liquibase
    implementation 'org.springframework.boot:spring-boot-starter-liquibase'
    runtimeOnly 'org.yaml:snakeyaml'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.h2database:h2'

    // SFTP Client: SSHJ
    implementation 'com.hierynomus:sshj:0.38.0'

    // DevTools
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // Tests
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.testcontainers:testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    
    // Apache MINA SSHD for testing
    testImplementation 'org.apache.sshd:sshd-core:2.14.0'
    testImplementation 'org.apache.sshd:sshd-sftp:2.14.0'
}

springBoot {
    buildInfo()
}

compileJava {
    options.compilerArgs << '-Alog4j.graalvm.groupId=org.pk.collector' << '-Alog4j.graalvm.artifactId=collector'
    // Temporarily disabled deprecation warning while we fix it properly
}

def generateGitProperties = tasks.register('generateGitProperties') {
    def outputDir = layout.buildDirectory.dir("generated/git").get().asFile
    def outputFile = new File(outputDir, "git.properties")
    
    outputs.dir(outputDir)

    doLast {
        def branch = 'unknown'
        def commit = 'unknown'
        
        try {
            // Using standard Groovy process execution to simplify
            branch = 'git rev-parse --abbrev-ref HEAD'.execute().text.trim()
            commit = 'git rev-parse HEAD'.execute().text.trim()
        } catch (Exception e) {
            println "Git command failed: ${e.message}"
        }

        if (!branch) branch = 'unknown'
        if (!commit) commit = 'unknown'

        outputDir.mkdirs()
        
        def props = new Properties()
        props.setProperty("git.branch", branch)
        props.setProperty("git.commit.id", commit)
        props.setProperty("git.commit.id.abbrev", commit.length() >= 7 ? commit.substring(0, 7) : commit)
        
        outputFile.withOutputStream { out ->
            props.store(out, null)
        }
    }
}

sourceSets {
    main {
        resources {
            srcDir generateGitProperties
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs("-XX:+EnableDynamicAgentLoading")
    ignoreFailures = true
    finalizedBy jacocoTestReport // Generate report after tests run
}

jacoco {
    toolVersion = "0.8.14"
}

def jacocoExcludes = [
    'org/pk/collector/core/repository/**',
    'org/pk/collector/Application.class'
]

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = false
        csv.required = false
        html.required = true
    }
    classDirectories.setFrom(files(sourceSets.main.output.classesDirs.collect {
        fileTree(dir: it, exclude: jacocoExcludes)
    }))
}

jacocoTestCoverageVerification {
    dependsOn test
    violationRules {
        rule {
            limit {
                minimum = 0.80
            }
        }
    }
    classDirectories.setFrom(files(sourceSets.main.output.classesDirs.collect {
        fileTree(dir: it, exclude: jacocoExcludes)
    }))
}

check.dependsOn jacocoTestCoverageVerification