databaseChangeLog:
  - changeSet:
      id: "1.0-create-sftp-files-table"
      author: "p"
      changes:
        - createTable:
            tableName: "sftp_file_registry"
            columns:
              - column:
                  name: "id"
                  type: "VARCHAR(255)"
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: "status"
                  type: "VARCHAR(10)"
                  defaultValue: "NEW"
                  constraints:
                    nullable: false
              - column:
                  name: "server_id"
                  type: "VARCHAR(30)"
                  constraints:
                    nullable: false
              - column:
                  name: "file_path"
                  type: "VARCHAR(512)"
                  constraints:
                    nullable: false
              - column:
                  name: "file_size"
                  type: "BIGINT"
              - column:
                  name: "created_at"
                  type: "TIMESTAMP WITH TIME ZONE"
              - column:
                  name: "modified_at"
                  type: "TIMESTAMP WITH TIME ZONE"
              - column:
                  name: "last_seen_at"
                  type: "DATE"
                  constraints:
                    nullable: false
        - createIndex:
            indexName: "idx_server_path_unique"
            tableName: "sftp_file_registry"
            unique: true
            columns:
              - column:
                  name: "server_id"
              - column:
                  name: "file_path"
        - createIndex:
            indexName: "idx_sftp_file_status"
            tableName: "sftp_file_registry"
            columns:
              - column:
                  name: "status"

  - changeSet:
      id: "2-create-job-state-table"
      author: "p"
      changes:
        - createTable:
            tableName: job_state
            columns:
              - column:
                  name: id
                  type: varchar(255)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: last_run_started_at
                  type: timestamp
                  remarks: "Tracks when the watchdog last locked the job"
              - column:
                  name: last_run_ended_at
                  type: timestamp
                  remarks: "Tracks when the background execution finished to calculate fixed delay"
              - column:
                  name: is_running
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
                  remarks: "Mutex lock to prevent concurrent executions across cluster nodes"
              - column:
                  name: current_execution_id
                  type: varchar(36)
                  remarks: "Idempotency key to prevent restart overlaps"
